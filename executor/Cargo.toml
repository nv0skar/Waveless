[package]
name = "waveless_executor"
version.workspace = true
edition.workspace = true

[dependencies]
waveless_commons.workspace = true
waveless_sql.workspace = true

rustyrosetta = { workspace = true, features = ["all"] }

tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["full"] }
tokio-rustls = { workspace = true, features = ["ring"] }
rustls = { workspace = true }
futures.workspace = true
hyper = { workspace = true, features = ["full"]}
hyper-util = { workspace = true, features = ["full", "server-auto"] }
http-body-util.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["full"] }
tower-http-cache.workspace = true
tower_governor.workspace = true
http.workspace = true
matchit.workspace = true
hyper-tungstenite.workspace = true
bytes.workspace = true
serde_json.workspace = true
compact_str.workspace = true
dashmap.workspace = true
mimalloc.workspace = true
clap.workspace = true
chrono.workspace = true
tracing.workspace = true
getset.workspace = true
derive_more.workspace = true
eyre.workspace = true
color-eyre.workspace = true

[features]
all = ["mysql", "postgres"]

mysql = ["waveless_sql/mysql"]
postgres = ["waveless_sql/postgres"]
