[package]
name = "waveless_compiler"
description.workspace = true
version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
waveless_commons.workspace = true

waveless_sql = { workspace = true}

rustyrosetta = { workspace = true, features = ["all"] }

tokio = { workspace = true, features = ["rt-multi-thread", "sync", "tracing"] }
serde_json.workspace = true
sea-schema = { workspace = true, features = [
    "runtime-tokio",
    "runtime-tokio-rustls",
    "sqlx-all",
] }
toml.workspace = true
hex.workspace = true
compact_str.workspace = true
crc32fast.workspace = true
owo-colors.workspace = true
tracing.workspace = true
chrono.workspace = true
getset.workspace = true
either.workspace = true
derive_more.workspace = true
eyre.workspace = true
color-eyre.workspace = true

[features]
all = ["mysql", "postgres"]

mysql = ["waveless_sql/mysql"]
postgres = ["waveless_sql/postgres"]
